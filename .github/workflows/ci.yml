name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Built-in token that GitHub creates for each run. No stored secret is used.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt
      # Integration tests (marker "integration") need a real Supabase project and API keys.
      # CI has neither, so they are left out. conftest.py fills in dummy Supabase values for unit tests.
      - name: Run unit tests
        run: python -m pytest -m "not integration" -q
